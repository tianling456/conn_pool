app:
  datasource:
    default-pool: master
    pools:
      - name: master
        driver: mysql
        host: 127.0.0.1
        port: 3306
        database: master
        username: tianling
        password: 4030tianling
        min-pool-size: 5
        max-pool-size: 20
        connection-timeout: 3000
        idle-timeout: 600000
        max-lifetime: 1800000
        health-check:
          enabled: true
          interval: 30000
          validation-query: "SELECT 1"
          validation-timeout: 2000
        retry:
          max-attempts: 3
          backoff: 300
          multiplier: 2.0
          max-backoff: 5000
      - name: slave
        driver: mysql
        host: 127.0.0.1
        port: 3306
        database: slave
        username: tianling
        password: 4030tianling
        min-pool-size: 2
        max-pool-size: 10
        connection-timeout: 2000
        idle-timeout: 300000
        max-lifetime: 1800000
        health-check:
          enabled: true
          interval: 30000
          validation-query: "SELECT 1"
        retry:
          max-attempts: 2
          backoff: 200
          multiplier: 2.0
      - name: pg_main
        driver: postgresql
        host: 127.0.0.1
        port: 5432
        database: postgres
        username: postgres
        password: 4030tianling
        min-pool-size: 3
        max-pool-size: 15
        connection-timeout: 3000
        idle-timeout: 600000
        max-lifetime: 1800000
        health-check:
          enabled: true
          interval: 30000
          validation-query: "SELECT 1"
          validation-timeout: 2000
          retry: { max-attempts: 3, backoff: 300, multiplier: 2.0, max-backoff: 5000 }
      # ========= 新增 Oracle 池 =========
      - name: ora_main
        driver: oracle
        host: 127.0.0.1
        port: 1521
        database: ORCLPDB1          # SERVICE_NAME 或 tnsnames.ora 别名
        username: app_user
        password: app_password
        min-pool-size: 2
        max-pool-size: 10
        connection-timeout: 3000
        idle-timeout: 600000
        max-lifetime: 1800000
        health-check:
          enabled: true
          interval: 30000
          validation-query: "SELECT 1 FROM DUAL"   # 注意不是 SELECT 1
          validation-timeout: 2000
        retry: { max-attempts: 3, backoff: 300, multiplier: 2.0, max-backoff: 5000 }
      # ========= SQLite（本地文件） =========
      - name: sqlite_local
        driver: sqlite
        database: /var/lib/app/local.db     # ← 直接当文件路径
        # host/port/username/password 全部无需配置
        min-pool-size: 1                    # SQLite 写并发低，建议 1-4
        max-pool-size: 4
        connection-timeout: 5000            # 同时作为 busy_timeout (ms)
        idle-timeout: 600000
        max-lifetime: 1800000
        health-check:
          enabled: true
          interval: 30000
          validation-query: "SELECT 1"
          validation-timeout: 2000
        retry: { max-attempts: 3, backoff: 200, multiplier: 2.0, max-backoff: 2000 }

  sql:
    default-datasource: master
    substitution-policy: identifier
    log:
      enabled: true
      params: true
    mapper-locations:
      - ../mappers/user.xml
      - ../mappers/order_pg.xml
    interceptors:
      - name: slow-sql-logger
        priority: 10
        params: { threshold-ms: "200" }
      - name: query-cache
        priority: 20
        params: { max-size: "1024", ttl-seconds: "60" }
      - name: metrics
        priority: 30

  tx:
    methods:
      - name: user.createUser
        isolation: READ_COMMITTED
        read-only: false
        timeout-sec: 5
        propagation: REQUIRED
      - name: user.queryUsers
        read-only: true
        timeout-sec: 30
        propagation: SUPPORTS